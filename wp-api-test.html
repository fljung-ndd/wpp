<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>WP API Test</title><link rel="stylesheet" href="wk.css"></head><body><script src="wk.js"></script><script>document.write(renderHeader('wp-api-test.html'));</script><section style="padding:8rem 0;background:var(--sage)"><div class="container"><div class="section-tag">Headless WordPress</div><h1 class="section-h2">WordPress REST API Test</h1><div id="posts">Lade Beiträge...</div></div></section><script>const API='https://waldkaetzchen.waldkaetzchen.de/wp-json/wp/v2';async function loadPosts(){const el=document.getElementById('posts');try{const res=await fetch(`${API}/posts?_embed=1&per_page=6`);if(!res.ok) throw new Error('API Fehler');const posts=await res.json();if(!posts.length){el.innerHTML='<div class="prob-card">Keine Beiträge vorhanden.</div>';return;}el.innerHTML='<div class="grid-3" id="post-grid"></div>';const grid=document.getElementById('post-grid');posts.forEach(post=>{const img=post._embedded?.['wp:featuredmedia']?.[0]?.source_url||'https://waldkaetzchen.waldkaetzchen.de/wp-content/uploads/2026/05/background-lichtung-quer.png';const card=document.createElement('article');card.className='ang-card';card.innerHTML=`<div class="ang-card-img"><img src="${img}" alt=""></div><div class="ang-card-body"><div style="font-size:.7rem;font-weight:700;color:var(--p2);margin-bottom:.5rem">${new Date(post.date).toLocaleDateString('de-DE')}</div><h3 style="margin-bottom:.7rem">${post.title.rendered}</h3><div style="font-size:.9rem;line-height:1.7;color:var(--textMid)">${post.excerpt.rendered}</div></div>`;grid.appendChild(card);});}catch(e){el.innerHTML=`<div class="prob-card">⚠️ Fehler beim Laden der WordPress API.<br>${e.message}</div>`;}}loadPosts();</script><script>document.write(renderFooter());</script></body></html>
